# Este arquivo e instalado como o virtual host. As rotas de dominio ficam no
# snippet root-only /etc/nginx/snippets/hype-backend-active.conf, um symlink
# atomico para a implementacao Node ou Supabase Edge. Consulte DEPLOY_RUNBOOK.md.
limit_req_zone $binary_remote_addr zone=hype_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=hype_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name hypedelivery.com.br parceiros.hypedelivery.com.br;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hypedelivery.com.br;

    return 301 https://hypedelivery.com.br$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    server_name www.hypedelivery.com.br;

    ssl_certificate /etc/letsencrypt/live/hypedelivery.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hypedelivery.com.br/privkey.pem;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://sjzdvlqnhhgbqdsvwiqt.supabase.co wss://sjzdvlqnhhgbqdsvwiqt.supabase.co; frame-src 'none'; worker-src 'self' blob:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    return 301 https://hypedelivery.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hypedelivery.com.br;

    ssl_certificate /etc/letsencrypt/live/hypedelivery.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hypedelivery.com.br/privkey.pem;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://sjzdvlqnhhgbqdsvwiqt.supabase.co wss://sjzdvlqnhhgbqdsvwiqt.supabase.co; frame-src 'none'; worker-src 'self' blob:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

    # Inclui somente as localizacoes exatas /api/backend,
    # /api/webhooks/asaas e o prefixo /storage/. O arquivo de destino e 0600.
    include /etc/nginx/snippets/hype-backend-active.conf;

    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
    }

    # /api/health e qualquer rota /api/ nao listada no snippet continuam no
    # processo Node local. As localizacoes exatas do snippet tem precedencia.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 6m;
        limit_req zone=hype_api burst=40 nodelay;
        limit_conn hype_per_ip 20;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}

